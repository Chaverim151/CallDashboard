<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Share your location — MC Hatzolah</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; min-height:100dvh; background:#0a1628; color:#e8eef8; font-family:'Inter',system-ui,sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px calc(20px + env(safe-area-inset-left,0px)); }
  .card { width:100%; max-width:420px; background:#101f38; border:1px solid rgba(255,255,255,0.09); border-radius:16px; padding:26px 22px; text-align:center; }
  h1 { font-family:'Oswald',sans-serif; font-size:1.25rem; letter-spacing:0.04em; text-transform:uppercase; margin:0 0 6px; color:#fff; }
  p  { font-size:0.95rem; line-height:1.55; color:#9fb0c9; margin:0 0 18px; }
  button { width:100%; border:none; border-radius:11px; padding:17px; font-family:'Oswald',sans-serif; font-size:1rem; font-weight:700;
           letter-spacing:0.06em; text-transform:uppercase; background:linear-gradient(135deg,#c9a84c,#e8960a); color:#0a1628; cursor:pointer; }
  button[disabled] { opacity:0.55; cursor:default; }
  .note { font-size:0.8rem; color:#7f8ea6; margin-top:16px; line-height:1.5; }
  .ok   { color:#7dedb5; } .warn { color:#ffc84a; } .err { color:#ff9090; }
  .big  { font-family:'Oswald',sans-serif; font-size:1.05rem; }
</style>
</head>
<body>
  <div class="card">
    <img src="https://i.ibb.co/j40wTVT/hatzolah-middelessex-county-final-removebg-preview-1-20231129-233435-0000.png"
         alt="Hatzolah Middlesex County" style="width:112px;height:auto;margin:0 auto 14px;display:block">
    <h1 id="head">Share your location</h1>
    <p id="msg">Tap the button and choose <b>Allow</b>. This sends your position to the dispatcher so the ambulance can find you.</p>
    <button id="go">📍 Share my location</button>
    <div id="where" style="display:none;margin-top:18px;padding:14px;border:1px solid rgba(255,255,255,0.1);border-radius:11px;text-align:left">
      <div style="font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;color:#7f8ea6;margin-bottom:4px">Closest address</div>
      <div id="addr" class="big" style="color:#fff;line-height:1.35">Looking it up…</div>
      <div id="coords" style="font-size:0.82rem;color:#9fb0c9;margin-top:6px;font-variant-numeric:tabular-nums"></div>
      <div id="acc" style="font-size:0.82rem;margin-top:6px"></div>
      <div id="updated" style="font-size:0.76rem;color:#7f8ea6;margin-top:8px"></div>
    </div>
    <div class="note" id="note">Your location is used for this call only.</div>
  </div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig = { apiKey:"AIzaSyDFWxlw9aLIn9HB2L_B6vbhvY5-nlXhpHM", authDomain:"hvac-ops.firebaseapp.com",
  projectId:"hvac-ops", storageBucket:"hvac-ops.firebasestorage.app", messagingSenderId:"636260762798", appId:"1:636260762798:web:2ae24d5c15f3aeb315993f" };
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

var token = new URLSearchParams(location.search).get("t") || "";
var head = document.getElementById("head"), msg = document.getElementById("msg"),
    btn = document.getElementById("go"), note = document.getElementById("note");

function beat(status) {
  if (!token) return Promise.resolve();
  return db.collection("locationRequests").doc(token).set({
    status: status, seenAt: new Date().toISOString(),
    device: (navigator.userAgent || "").slice(0, 120)
  }, { merge: true }).catch(function(){});
}
if (token) {
  beat("opened");                                   // the link was tapped
  setInterval(function(){ beat(sentAny ? "sharing" : "opened"); }, 20000);
  window.addEventListener("pagehide", function(){ beat("closed"); });
  document.addEventListener("visibilitychange", function(){ beat(document.hidden ? "background" : (sentAny ? "sharing" : "opened")); });
}
if (!token) { head.textContent = "Link not valid"; msg.textContent = "Ask the dispatcher to send the link again."; btn.style.display = "none"; }

// Accuracy is reported in metres by the device. Anything worse than ~150m is a neighbourhood, not an
// address, so the page keeps trying for a better fix and tells the dispatcher how good it is.
function grade(acc) {
  if (acc <= 25)  return { label: "Precise", cls: "ok" };
  if (acc <= 75)  return { label: "Good", cls: "ok" };
  if (acc <= 150) return { label: "Approximate", cls: "warn" };
  return { label: "Rough — area only", cls: "err" };
}

var best = null, watchId = null, sentAny = false, lastSentAt = null, lastAddr = "", lastAddrAt = 0;

function fmtAgo(ms) {
  var s = Math.round(ms / 1000);
  if (s < 5) return "just now";
  if (s < 60) return s + " seconds ago";
  var m = Math.round(s / 60);
  return m === 1 ? "a minute ago" : m + " minutes ago";
}
// The "last updated" line ticks on its own, so a stale fix never looks fresh.
setInterval(function() {
  if (!lastSentAt) return;
  document.getElementById("updated").textContent = "Last updated " + fmtAgo(Date.now() - lastSentAt);
}, 5000);

// Reverse geocode through Google's free-form endpoint used by the Maps JS API would need a key, so
// the page asks the dispatch system's own Firestore-free fallback: OpenStreetMap's Nominatim, which
// allows light use from a browser. It is only ever shown to the caller as a sanity check.
function showAddress(lat, lng) {
  if (Date.now() - lastAddrAt < 15000) return;      // don't re-look-up on every small improvement
  lastAddrAt = Date.now();
  fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" + lat + "&lon=" + lng + "&zoom=18&addressdetails=1", { headers: { "Accept": "application/json" } })
    .then(function(r){ return r.json(); })
    .then(function(j) {
      var a = j && j.address ? j.address : null;
      if (!a) return;
      var line = [ (a.house_number ? a.house_number + " " : "") + (a.road || ""), a.city || a.town || a.village || a.hamlet || "", a.state || "" ]
                 .map(function(x){ return String(x).trim(); }).filter(Boolean).join(", ");
      if (line) { lastAddr = line; document.getElementById("addr").textContent = line; }
    })
    .catch(function(){ /* the coordinates are what matter; the address is a courtesy */ });
}

function send(pos, done) {
  var g = grade(pos.coords.accuracy);
  return db.collection("locationRequests").doc(token).set({
    lat: pos.coords.latitude, lng: pos.coords.longitude,
    accuracy: Math.round(pos.coords.accuracy), accuracyLabel: g.label,
    approxAddress: lastAddr || null,
    at: new Date().toISOString(), final: !!done
  }, { merge: true }).then(function() { lastSentAt = Date.now(); });
}

btn.addEventListener("click", function() {
  if (!navigator.geolocation) {
    head.textContent = "Not supported";
    msg.innerHTML = 'This phone can\'t share its location. Please tell the dispatcher your address.';
    btn.style.display = "none"; return;
  }
  btn.disabled = true; btn.textContent = "Locating…";
  msg.textContent = "Hold still for a few seconds — the location gets more accurate as it settles.";

  // Keep streaming for as long as the page is open — a caller who is walking, or in a moving car,
  // stays current rather than frozen at the first fix.
  watchId = navigator.geolocation.watchPosition(function(pos) {
    best = pos;
    var g = grade(pos.coords.accuracy);
    showAddress(pos.coords.latitude, pos.coords.longitude);
    document.getElementById("where").style.display = "block";
    document.getElementById("coords").textContent = pos.coords.latitude.toFixed(6) + ", " + pos.coords.longitude.toFixed(6);
    document.getElementById("acc").innerHTML = '<span class="' + g.cls + '">' + g.label + ' — within ' + Math.round(pos.coords.accuracy) + ' m</span>';
    send(pos, false).then(function() {
      sentAny = true;
      document.getElementById("updated").textContent = "Last updated just now";
      head.textContent = "Sharing your location";
      msg.innerHTML = 'The dispatcher can see where you are. <b>Keep this page open</b> until help arrives.';
      btn.textContent = "✓ Sharing — keep this page open";
      note.textContent = "Your location keeps updating while this page is open.";
    }).catch(function() {
      head.textContent = "Couldn't send";
      msg.textContent = "Please tell the dispatcher your address.";
    });
  }, function(err) {
    if (sentAny) return;
    head.textContent = err.code === 1 ? "Permission needed" : "Couldn't get a location";
    msg.innerHTML = err.code === 1
      ? 'Location is blocked for this browser. Please tell the dispatcher your address.'
      : 'Please tell the dispatcher your address.';
    btn.disabled = false; btn.textContent = "📍 Try again";
  }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });

  // Streaming continues until the page is closed.
  window.addEventListener("pagehide", function() {
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    if (best) send(best, true);
  });
});
</script>
</body>
</html>
