<style>
:root{--navy:#0a1628;--navy-mid:#122040;--navy-light:#1c3260;--gold:#c9a84c;--gold-light:#e8c96a;--gold-rgb:201,168,76;--white:#f4f6fa;--gray:#8a9ab5;--card-border:rgba(var(--gold-rgb),0.2)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:var(--white);font-family:'Source Sans 3',sans-serif;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.top{background:var(--navy-mid);border-bottom:1px solid var(--card-border)}   /* scrolls away, so a protocol gets the whole screen */
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;max-width:900px;margin:0 auto}
.bar img{width:30px;height:30px;object-fit:contain}
.h-title{font-family:'Oswald',sans-serif;font-size:1.05rem;font-weight:700;letter-spacing:0.05em}
.beta{font-family:'Oswald',sans-serif;font-size:0.6rem;font-weight:700;letter-spacing:0.12em;background:#f0a500;color:#0a1628;border-radius:4px;padding:2px 6px}
.back{margin-left:auto;color:var(--gray);font-size:0.82rem;text-decoration:none;border:1px solid var(--card-border);border-radius:7px;padding:5px 10px;background:none;cursor:pointer;font-family:inherit}
.searchrow{display:flex;gap:8px;padding:0 14px 10px;max-width:900px;margin:0 auto}
#q{flex:1;min-width:0;background:rgba(255,255,255,0.07);border:1px solid var(--card-border);border-radius:10px;color:var(--white);font:inherit;font-size:1rem;padding:10px 12px}
#go{background:var(--gold);color:var(--navy);border:none;border-radius:10px;font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:0.06em;padding:0 16px;cursor:pointer}
.lvlrow{display:flex;gap:6px;align-items:center;padding:0 14px 10px;max-width:900px;margin:0 auto;font-size:0.78rem;color:var(--gray);flex-wrap:wrap}
.lvl{background:rgba(255,255,255,0.05);border:1px solid var(--card-border);color:#d6deea;border-radius:14px;padding:4px 11px;font:inherit;font-size:0.8rem;cursor:pointer}
.lvl.on{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}
.warn{font-size:0.74rem;color:#ffd27a;background:rgba(240,165,0,0.1);border-top:1px solid rgba(240,165,0,0.3);padding:6px 14px;text-align:center}
main{max-width:900px;margin:0 auto;padding:14px}
.msg{color:var(--gray);padding:20px 4px;line-height:1.6}
.card{display:block;width:100%;text-align:left;background:rgba(255,255,255,0.04);border:1px solid var(--card-border);border-radius:12px;padding:12px 14px;margin-bottom:10px;color:inherit;font:inherit;cursor:pointer;text-decoration:none}
.card:hover{border-color:var(--gold)}
.c-num{font-family:'Oswald',sans-serif;color:var(--gold-light);font-size:0.8rem;letter-spacing:0.06em}
.c-title{font-family:'Oswald',sans-serif;font-size:1.05rem;font-weight:600;letter-spacing:0.03em;margin:1px 0 4px}
.c-meta{font-size:0.74rem;color:var(--gray)}
.c-snip{font-size:0.88rem;color:#c9d4e6;margin-top:6px;line-height:1.45}
mark{background:rgba(255,213,0,0.3);color:inherit;border-radius:2px;padding:0 1px}
.tag{display:inline-block;font-size:0.6rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;border-radius:4px;padding:1px 6px;margin-right:5px;vertical-align:1px}
.t-EMT{background:rgba(76,175,128,0.2);color:#7dedb5;border:1px solid rgba(76,175,128,0.5)}
.t-ALS{background:rgba(224,85,85,0.18);color:#ff9f9f;border:1px solid rgba(224,85,85,0.5)}
.t-CF{background:rgba(66,165,245,0.18);color:#9fd2ff;border:1px solid rgba(66,165,245,0.5)}
.t-ONLY{background:rgba(224,85,85,0.25);color:#ffb3b3;border:1px solid rgba(224,85,85,0.6)}
.sec-h{font-family:'Oswald',sans-serif;font-size:0.9rem;letter-spacing:0.06em;color:var(--gold-light);margin:18px 0 8px;text-transform:uppercase}
.browse summary{list-style:none;cursor:pointer;font-family:'Oswald',sans-serif;font-size:1rem;letter-spacing:0.04em;padding:12px 14px;background:rgba(255,255,255,0.04);border:1px solid var(--card-border);border-radius:10px;margin-bottom:8px}
.browse summary::-webkit-details-marker{display:none}
.browse summary::before{content:"▸ ";color:var(--gold)}
.browse details[open] summary::before{content:"▾ "}
.blist a{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.06);color:var(--white);text-decoration:none;font-size:0.92rem}
.blist a:hover{background:rgba(255,255,255,0.04)}
.blist .n{font-family:'Oswald',sans-serif;color:var(--gold-light);min-width:44px}
/* Protocol view — styled like the printed protocol */
.pv-head{border-radius:10px;background:#1e3a6e;padding:12px 14px;margin-bottom:10px}
.pv-num{font-family:'Oswald',sans-serif;font-size:0.85rem;color:#c7d8ff;letter-spacing:0.06em}
.pv-title{font-family:'Oswald',sans-serif;font-size:1.25rem;font-weight:700;letter-spacing:0.03em;line-height:1.2}
.pv-meta{font-size:0.78rem;color:#c7d8ff;margin-top:4px}
.pv-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn{background:rgba(255,255,255,0.06);border:1px solid var(--card-border);color:var(--white);border-radius:8px;padding:8px 12px;font:inherit;font-size:0.85rem;cursor:pointer}
.only{background:rgba(224,85,85,0.14);border:1px solid rgba(224,85,85,0.5);color:#ffc2c2;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem}
.sec{margin-bottom:12px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.08)}
.sec-bar{font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:0.06em;font-size:0.82rem;padding:6px 12px;color:#fff;display:flex;align-items:center;gap:8px}
.lv-EMT .sec-bar{background:#00a651}.lv-ALS .sec-bar{background:#e02020}.lv-CF .sec-bar{background:#1fa3dc}.lv-PEARLS .sec-bar{background:#8fb3d9;color:#0a1628}.lv-ALL .sec-bar{background:#2a3d63}

.sec.closed .sec-body{display:none}
.sec-toggle{margin-left:auto;font-family:'Source Sans 3',sans-serif;font-weight:600;font-size:0.75rem;letter-spacing:0;background:rgba(0,0,0,0.25);border:none;color:#fff;border-radius:6px;padding:3px 8px;cursor:pointer}
.step{display:flex;gap:9px;margin:7px 0}
.step .no{font-family:'Oswald',sans-serif;color:var(--gold-light);min-width:20px;text-align:right}
.step ul,.sec-body>ul{margin:4px 0 2px 18px}
.step li,.sec-body li{margin:3px 0}
.subh{font-family:'Oswald',sans-serif;font-size:0.8rem;letter-spacing:0.06em;color:var(--gold-light);margin:12px 0 4px}
.conj{font-weight:700;color:var(--gray);font-size:0.8rem;margin:2px 0 2px 30px}
.pgsep{font-size:0.68rem;color:var(--gray);text-align:center;margin:10px 0;letter-spacing:0.05em}
.caution{background:rgba(240,165,0,0.12);border-left:3px solid #f0a500;padding:4px 8px;border-radius:4px}
.hitline{background:rgba(255,213,0,0.08);border-radius:6px;outline:1px solid rgba(255,213,0,0.35);outline-offset:3px}
.pdfpage{position:relative;background:#fff;border-radius:4px;margin-bottom:12px;box-shadow:0 6px 20px rgba(0,0,0,0.4)}
.pdfpage canvas{display:block;width:100%;height:auto;border-radius:4px}
.hl{position:absolute;background:rgba(255,213,0,0.42);mix-blend-mode:multiply;border-radius:2px}
#ackbox,#gate{max-width:520px;margin:30px auto;padding:22px;border:1px solid var(--card-border);border-radius:12px;background:rgba(255,255,255,0.03);line-height:1.6}

.ai-wait{color:var(--gray);font-size:0.86rem;padding:10px 2px;font-style:italic}
.ai-note{color:var(--gray);font-size:0.76rem;padding:2px 2px 12px}
.c-why{font-size:0.84rem;color:#bfe0ff;margin-top:5px}
.t-AI{background:rgba(160,120,255,0.2);color:#d6c8ff;border:1px solid rgba(160,120,255,0.5)}
.hero{padding:26px 4px 8px;text-align:center}

.hero p{color:var(--gray);font-size:0.9rem;margin-bottom:16px}
.askbox{display:flex;flex-direction:column;gap:10px;background:rgba(255,255,255,0.04);border:1px solid var(--card-border);border-radius:14px;padding:12px}

#hq::placeholder,#q::placeholder{color:#9fb0c8}
#hgo{background:var(--gold);color:var(--navy);border:none;border-radius:10px;font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:0.06em;font-size:1rem;padding:13px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 4px}

.browsebtn{display:flex;align-items:center;justify-content:center;gap:8px;margin:22px auto 6px;max-width:420px;padding:14px;border:1px solid var(--card-border);border-radius:12px;background:rgba(255,255,255,0.04);color:var(--white);text-decoration:none;font-family:'Oswald',sans-serif;letter-spacing:0.04em;font-size:1rem}
.hero-lvl{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:0.8rem;color:var(--gray)}
#modal{position:fixed;inset:0;z-index:100;background:rgba(5,10,20,0.82);display:flex;align-items:center;justify-content:center;padding:18px}
#modal .box{max-width:460px;width:100%;background:var(--navy-mid);border:1px solid rgba(240,165,0,0.55);border-radius:14px;padding:20px;line-height:1.55;box-shadow:0 20px 50px rgba(0,0,0,0.6)}
#modal h2{font-family:'Oswald',sans-serif;letter-spacing:0.04em;margin-bottom:8px;display:flex;align-items:center;gap:8px}
#modal ul{margin:8px 0 14px 20px;font-size:0.94rem}
#modal button{width:100%;background:var(--gold);color:var(--navy);border:none;border-radius:10px;font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:0.06em;font-size:1rem;padding:13px;cursor:pointer}
.ans{background:linear-gradient(180deg,rgba(160,120,255,0.10),rgba(255,255,255,0.03));border:1px solid rgba(160,120,255,0.45);border-radius:14px;padding:14px;margin-bottom:14px}
.ans-h{font-family:'Oswald',sans-serif;font-size:1rem;letter-spacing:0.05em;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.ans-warn{background:rgba(240,165,0,0.14);border:1px solid rgba(240,165,0,0.55);color:#ffd27a;border-radius:9px;padding:9px 11px;font-size:0.86rem;line-height:1.45;margin-bottom:10px}
.ans-list{margin:0 0 0 18px;font-size:1rem;line-height:1.55}
.ans-list li{margin:7px 0}
.ref{display:inline-block;font-family:'Oswald',sans-serif;font-size:0.72rem;letter-spacing:0.04em;background:rgba(122,184,245,0.16);border:1px solid rgba(122,184,245,0.55);color:#bfe0ff;border-radius:6px;padding:2px 8px;margin:2px 3px 0 0;text-decoration:none;white-space:nowrap}
.ans-foot{font-size:0.74rem;color:var(--gray);margin-top:8px;line-height:1.45}
.frame{background:linear-gradient(180deg,rgba(160,120,255,0.10),rgba(255,255,255,0.03));border:1px solid rgba(160,120,255,0.45);border-radius:14px;padding:14px;margin-bottom:12px}
.frame-ref{font-size:1rem;line-height:1.5}
.others{margin-top:16px}
.others summary{cursor:pointer;color:var(--gray);font-size:0.86rem;padding:10px 2px;min-height:44px;display:flex;align-items:center}
</style>

function titleCase(t) { return String(t).toLowerCase().replace(/(^|[\s(\/–-])([a-z])/g, function(m, a, b) { return a + b.toUpperCase(); }).replace(/\b(Ems|Als|Bls|Emt|Micn|Cpap|Bipap|Copd|Txa|Ecg|Brue|Polst|Dnr|Mci|Lvad|Rsv|Stemi|Iv|Io|Cpr|Aed)\b/g, function(w) { return w.toUpperCase(); }); }

// ── AI search (Gemini free tier, through the server): picks protocols and the exact lines that matter.

PS.ai = {};
function protoText(pr) {

}
// What the AI reads for a candidate: the steps for this provider's level first, then the rest, then

function protoTextFor(pr, level) {

function normTxt(t) { return String(t || "").replace(/[•▪■\uE000-\uF8FF]/g, " ").replace(/\s+/g, " ").trim().toLowerCase(); }

function quoteCore(t) { return normTxt(t).replace(/^(\d{1,2}\.|o|-|–)\s+/, ""); }

var SEC_NAME = { EMT: "EMT section", ALS: "Paramedic & MICN section", CF: "Communication Failure section", PEARLS: "Pearls", ALL: "general section" };
// "EMT section, steps 1–2 (p. 25)" — worked out from where the highlighted lines are in the protocol.
function frameOf(pr, quotes) {

function card(k, q, extra) {

function boxIn(wrap, tc, vp, passage) {
