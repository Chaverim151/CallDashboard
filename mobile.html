<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hatzolah MC">
<meta name="theme-color" content="#0b1729">
<title>Hatzolah MC</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/j40wTVT/hatzolah-middelessex-county-final-removebg-preview-1-20231129-233435-0000.png">
<link rel="apple-touch-icon" href="https://i.ibb.co/j40wTVT/hatzolah-middelessex-county-final-removebg-preview-1-20231129-233435-0000.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#0a1628; --navy-mid:#122040; --navy-light:#1c3260;
  --gold:#c9a84c; --gold-light:#e8c96a; --white:#f4f6fa;
  --gray:#8a9ab5; --card-bg:rgba(255,255,255,0.04);
  --card-border:rgba(201,168,76,0.2); --green:#4caf80; --red:#e05555;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;overscroll-behavior:none;}
body{background:var(--navy);color:var(--white);font-family:'Source Sans 3',sans-serif;
  min-height:100vh;min-height:-webkit-fill-available;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(201,168,76,0.07) 0%,transparent 70%);pointer-events:none;z-index:0;}

/* ── PAGES ── */
.page{display:none;position:relative;z-index:1;min-height:100vh;}
.page.active{display:flex;flex-direction:column;}

/* ── TOPBAR ── */
.m-topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:max(12px,env(safe-area-inset-top)) 16px 12px;
  background:var(--navy);border-bottom:1px solid var(--card-border);
  flex-shrink:0;position:sticky;top:0;z-index:10;
}
.m-topbar-left{display:flex;align-items:center;gap:8px;}
.m-topbar-left img{width:32px;height:auto;}
.m-topbar-title{font-family:'Oswald',sans-serif;font-size:0.85rem;font-weight:700;letter-spacing:0.06em;color:var(--white);}
.m-topbar-title span{color:var(--gold);}
.m-topbar-right{display:flex;align-items:center;gap:6px;}
.m-unit{font-family:'Oswald',sans-serif;font-size:0.72rem;font-weight:700;color:var(--gray);letter-spacing:0.06em;}
.m-btn{background:rgba(255,255,255,0.05);border:1px solid var(--card-border);border-radius:7px;
  color:var(--gray);font-family:'Oswald',sans-serif;font-size:0.62rem;font-weight:700;
  letter-spacing:0.06em;text-transform:uppercase;padding:6px 10px;cursor:pointer;min-height:36px;}
.m-btn.danger{color:#ff9090;border-color:rgba(224,85,85,0.35);}
.m-clock{font-family:'Oswald',sans-serif;font-size:0.72rem;font-weight:700;
  color:var(--white);text-align:center;line-height:1.3;}

/* ── SCROLL CONTENT ── */
.m-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 14px calc(20px + env(safe-area-inset-bottom));overscroll-behavior:contain;}

/* ── LOGIN ── */
.m-login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 20px;}
.m-login-box{background:rgba(255,255,255,0.04);border:1px solid var(--card-border);
  border-radius:16px;padding:28px 24px;width:100%;max-width:360px;}
.m-login-logo{text-align:center;margin-bottom:16px;}
.m-login-logo img{width:56px;}
.m-login-title{font-family:'Oswald',sans-serif;font-size:1.3rem;font-weight:700;
  text-align:center;color:var(--white);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px;}
.m-login-title span{color:var(--gold);}
.m-login-sub{font-size:0.62rem;color:var(--gray);text-align:center;letter-spacing:0.08em;
  text-transform:uppercase;margin-bottom:20px;}
.m-field{margin-bottom:12px;}
.m-label{display:block;font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--gray);margin-bottom:5px;}
.m-unit-wrap{display:flex;align-items:center;background:rgba(255,255,255,0.06);
  border:1px solid var(--card-border);border-radius:8px;overflow:hidden;}
.m-unit-prefix{padding:0 10px;font-family:'Oswald',sans-serif;font-size:0.88rem;
  font-weight:700;color:var(--gold);border-right:1px solid var(--card-border);
  background:rgba(201,168,76,0.08);height:44px;display:flex;align-items:center;}
.m-input{width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--card-border);
  border-radius:8px;padding:12px 14px;color:var(--white);font-family:'Source Sans 3',sans-serif;
  font-size:16px;outline:none;}
.m-unit-input{background:transparent;border:none;padding:12px 10px;color:var(--white);
  font-family:'Oswald',sans-serif;font-size:0.88rem;font-weight:700;outline:none;
  width:80px;font-size:16px;}
.m-pw-wrap{position:relative;}
.m-pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--gray);cursor:pointer;font-size:1rem;padding:4px;}
.m-signin-btn{width:100%;background:var(--gold);color:var(--navy);border:none;
  border-radius:8px;font-family:'Oswald',sans-serif;font-size:0.95rem;font-weight:700;
  letter-spacing:0.08em;text-transform:uppercase;padding:14px;cursor:pointer;margin-top:8px;
  min-height:48px;}
.m-forgot{display:block;text-align:center;font-size:0.72rem;color:var(--gray);
  margin-top:12px;cursor:pointer;background:none;border:none;width:100%;}
.m-err{color:#ff9090;font-size:0.78rem;text-align:center;margin-top:8px;min-height:20px;}

/* ── ACTIVE CALLS ── */
.m-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.m-section-title{display:flex;align-items:center;gap:8px;font-family:'Oswald',sans-serif;
  font-size:0.72rem;letter-spacing:0.15em;text-transform:uppercase;color:#ff9090;}
.m-pulse{width:8px;height:8px;background:#e05555;border-radius:50%;animation:pulse-red 1.2s infinite;}
.m-count{background:#e05555;color:#fff;font-family:'Oswald',sans-serif;font-size:0.62rem;
  font-weight:700;padding:1px 6px;border-radius:10px;}
.m-no-calls{color:var(--gray);font-size:0.82rem;padding:8px 0;text-align:center;}

/* ── CALL CARD ── */
.m-call-card{background:rgba(224,85,85,0.06);border:1px solid rgba(224,85,85,0.3);
  border-radius:12px;padding:12px;margin-bottom:10px;position:relative;overflow:hidden;}
.m-call-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#e05555;}
.m-zone-pill{display:inline-flex;align-items:center;font-family:'Oswald',sans-serif;
  font-size:0.62rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;
  padding:3px 8px;border-radius:5px;border:1px solid;}
.m-zone-pill.primary{background:rgba(76,175,128,0.15);border-color:rgba(76,175,128,0.4);color:#7dedb5;}
.m-zone-pill.secondary{background:rgba(240,165,0,0.15);border-color:rgba(240,165,0,0.4);color:#ffc84a;}
.m-zone-pill.outside{background:rgba(224,85,85,0.15);border-color:rgba(224,85,85,0.4);color:#ff9090;}
.m-call-addr{font-family:'Oswald',sans-serif;font-size:1rem;font-weight:700;
  color:var(--white);line-height:1.3;margin:6px 0 2px;}
.m-call-cross{font-size:0.72rem;color:var(--gray);margin-bottom:6px;}
.m-pills{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;}
.m-pill{font-family:'Oswald',sans-serif;font-size:0.62rem;font-weight:700;
  letter-spacing:0.05em;text-transform:uppercase;padding:3px 8px;border-radius:5px;border:1px solid;}
.m-pill.nature{background:rgba(201,168,76,0.12);border-color:rgba(201,168,76,0.35);color:var(--gold);}
.m-pill.unit{background:rgba(74,144,217,0.12);border-color:rgba(74,144,217,0.3);color:#7ab8f5;}
.m-pill.als{background:rgba(224,85,85,0.2);border-color:rgba(224,85,85,0.5);color:#ff9090;}
.m-pill.disp-transport{background:rgba(74,144,217,0.15);border-color:rgba(74,144,217,0.4);color:#7ab8f5;}
.m-pill.disp-rma{background:rgba(76,175,128,0.15);border-color:rgba(76,175,128,0.4);color:#7dedb5;}
.m-times{font-size:0.65rem;color:var(--gray);margin-bottom:6px;display:flex;gap:10px;flex-wrap:wrap;}
.m-notes-section{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.06);}
.m-notes-label{font-size:0.58rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray);margin-bottom:4px;}
.m-note-item{font-size:0.72rem;color:var(--white);margin-bottom:3px;line-height:1.4;}
.m-note-meta{color:var(--gray);font-size:0.62rem;}
.m-card-actions{display:flex;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.06);}
.m-action-btn{flex:1;font-family:'Oswald',sans-serif;font-size:0.68rem;font-weight:700;
  letter-spacing:0.07em;text-transform:uppercase;padding:12px 8px;border-radius:8px;
  border:1px solid;cursor:pointer;background:transparent;min-height:44px;}
.m-action-btn.gold{border-color:rgba(201,168,76,0.4);color:var(--gold);}

/* ── STREET VIEW ── */
.m-sv{width:100%;height:120px;object-fit:cover;border-radius:8px;
  border:1px solid var(--card-border);margin-bottom:8px;display:block;}

/* ── HOME GRID ── */
.m-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.m-tile{background:rgba(255,255,255,0.04);border:1px solid var(--card-border);
  border-radius:14px;padding:0;cursor:pointer;text-decoration:none;
  position:relative;overflow:hidden;transition:all 0.2s;min-height:90px;display:block;}
.m-tile::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--accent,var(--gold));}
.m-tile:active{opacity:0.8;transform:scale(0.98);}
.m-tile-inner{padding:14px 12px;display:flex;flex-direction:column;gap:4px;}
.m-tile-icon{font-size:1.6rem;line-height:1;}
.m-tile-label{font-family:'Oswald',sans-serif;font-size:0.78rem;font-weight:700;
  letter-spacing:0.06em;text-transform:uppercase;color:var(--white);}
.m-tile-sub{font-size:0.6rem;color:var(--gray);line-height:1.3;}

/* ── SUBPAGE ── */
.m-subpage-header{display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:var(--navy);border-bottom:1px solid var(--card-border);
  position:sticky;top:0;z-index:10;flex-shrink:0;}
.m-back-btn{background:none;border:none;color:var(--gold);font-family:'Oswald',sans-serif;
  font-size:0.78rem;font-weight:700;letter-spacing:0.06em;cursor:pointer;padding:4px 0;min-height:36px;}
.m-page-title{font-family:'Oswald',sans-serif;font-size:0.82rem;font-weight:700;
  letter-spacing:0.1em;text-transform:uppercase;color:var(--white);}

/* ── DETAIL MODAL ── */
.m-modal-overlay{display:none;position:fixed;inset:0;z-index:600;
  background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);
  align-items:flex-end;justify-content:center;}
.m-modal-overlay.open{display:flex;}
.m-modal{background:#122040;border:1px solid rgba(224,85,85,0.4);
  border-radius:16px 16px 0 0;padding:0;width:100%;max-height:85vh;
  display:flex;flex-direction:column;animation:slideUp 0.25s ease;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.m-modal-header{padding:14px 16px;display:flex;justify-content:space-between;
  align-items:center;border-bottom:1px solid rgba(255,255,255,0.08);flex-shrink:0;}
.m-modal-title{font-family:'Oswald',sans-serif;font-size:0.82rem;font-weight:700;
  letter-spacing:0.1em;text-transform:uppercase;color:#ff9090;}
.m-modal-close{background:none;border:none;color:var(--gray);font-size:1.4rem;cursor:pointer;padding:0 4px;}
.m-modal-body{padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;}

/* ── TOAST ── */
.m-toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%);background:#1c3260;border:1px solid var(--card-border);
  border-radius:10px;padding:10px 18px;font-size:0.82rem;color:var(--white);
  z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
.m-toast.show{opacity:1;}
.m-toast.error{border-color:rgba(224,85,85,0.5);color:#ff9090;}

/* ── FORCE PASSWORD ── */
.m-fp-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;}
.m-fp-box{background:rgba(255,255,255,0.04);border:1px solid var(--card-border);
  border-radius:16px;padding:28px 24px;width:100%;max-width:360px;}

/* ── MISC ── */
.m-divider{height:1px;background:var(--card-border);margin:12px 0;}
.m-info-row{display:flex;flex-direction:column;gap:3px;padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,0.05);}
.m-info-label{font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray);}
.m-info-value{font-size:0.88rem;color:var(--white);font-weight:600;}
.m-alert-box{background:rgba(224,85,85,0.1);border:1px solid rgba(224,85,85,0.3);
  border-radius:10px;padding:12px;margin-bottom:10px;}
.m-alert-title{font-family:'Oswald',sans-serif;font-size:0.7rem;font-weight:700;
  letter-spacing:0.1em;text-transform:uppercase;color:#ff9090;margin-bottom:6px;}
.m-call-btn{display:inline-flex;align-items:center;gap:5px;background:rgba(76,175,128,0.15);
  border:1px solid rgba(76,175,128,0.4);border-radius:20px;padding:6px 14px;
  color:#7dedb5;font-family:'Oswald',sans-serif;font-size:0.72rem;font-weight:700;
  text-decoration:none;min-height:36px;}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse-red{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.2)}}
@keyframes als-flash{0%,100%{background:rgba(224,85,85,0.15)}50%{background:rgba(224,85,85,0.35)}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="page active" id="m-pg-login">
  <div class="m-login-wrap">
    <div class="m-login-box">
      <div class="m-login-logo"><img src="https://i.ibb.co/j40wTVT/hatzolah-middelessex-county-final-removebg-preview-1-20231129-233435-0000.png" alt="Logo"></div>
      <div class="m-login-title">Hatzolah <span>MC</span></div>
      <div class="m-login-sub">Operations Portal</div>
      <div class="m-field">
        <label class="m-label">Unit Number</label>
        <div class="m-unit-wrap">
          <span class="m-unit-prefix">MC-</span>
          <input class="m-unit-input" id="m-unit-input" type="tel" placeholder="16" autocomplete="off">
        </div>
      </div>
      <div class="m-field">
        <label class="m-label">Password</label>
        <div class="m-pw-wrap">
          <input class="m-input" id="m-pw-input" type="password" placeholder="Password" autocomplete="current-password">
          <button class="m-pw-toggle" onclick="toggleMPw()" type="button">👁</button>
        </div>
      </div>
      <button class="m-signin-btn" onclick="mSignIn()">Sign In</button>
      <button class="m-forgot" onclick="mForgotPw()">Forgot password?</button>
      <div class="m-err" id="m-err"></div>
    </div>
  </div>
</div>

<!-- FORCE PASSWORD CHANGE -->
<div class="page" id="m-pg-force-pw">
  <div class="m-fp-wrap">
    <div class="m-fp-box">
      <div style="font-family:'Oswald',sans-serif;font-size:1rem;font-weight:700;color:var(--white);margin-bottom:4px;text-align:center">Set New Password</div>
      <div style="font-size:0.75rem;color:var(--gray);text-align:center;margin-bottom:20px">You must set a new password before continuing</div>
      <div class="m-field">
        <label class="m-label">New Password</label>
        <input class="m-input" id="m-new-pw" type="password" placeholder="Minimum 8 characters">

      <div class="m-field">
        <label class="m-label">Confirm Password</label>
        <input class="m-input" id="m-new-pw2" type="password" placeholder="Repeat password">
      </div>
      <button class="m-signin-btn" onclick="mSetNewPw()">Set Password</button>
      <div class="m-err" id="m-fp-err"></div>
    </div>
  </div>
</div>

<!-- HOME -->
<div class="page" id="m-pg-home">
  <!-- Topbar -->
  <div class="m-topbar">
    <div class="m-topbar-left">
      <img src="https://i.ibb.co/j40wTVT/hatzolah-middelessex-county-final-removebg-preview-1-20231129-233435-0000.png" alt="Logo">
      <div>
        <div class="m-topbar-title">Hatzolah <span>MC</span></div>
      </div>
    </div>
    <div class="m-topbar-right">
      <div class="m-clock" id="m-clock"></div>
      <span class="m-unit" id="m-topbar-unit"></span>
      <button class="m-btn" id="m-alert-btn" onclick="mRequestPush()" style="color:var(--gray)">Alerts</button>
      <button class="m-btn danger" onclick="mSignOut()">Out</button>
    </div>
  </div>

  <div class="m-scroll">
    <!-- Active Calls -->
    <div id="m-calls-section" style="display:none;margin-bottom:16px">
      <div class="m-section-header">
        <div class="m-section-title">
          <div class="m-pulse"></div>
          Active Calls
          <span class="m-count" id="m-calls-count">0</span>
        </div>
      </div>
      <div id="m-calls-list"></div>
    </div>

    <!-- Home tiles -->
    <div class="m-grid" id="m-home-grid">
      <a class="m-tile" href="tel:7323481000" style="--accent:#8b7cef">
        <div class="m-tile-inner">
          <span class="m-tile-icon">📞</span>
          <span class="m-tile-label">RMA Hotline</span>
          <span class="m-tile-sub">732-348-1000</span>
        </div>
      </a>
      <button class="m-tile" onclick="mGoTo('hospital')" style="--accent:#8b7cef">
        <div class="m-tile-inner">

          <span class="m-tile-label">Hospital Codes</span>
          <span class="m-tile-sub">Saint Peters · RWJ · JFK</span>
        </div>
      </button>
      <a class="m-tile" href="https://chmiddlesex.imagetrendelite.com/Elite/Organizationchmiddlesex/RunForm/login" target="_blank" style="--accent:#4caf80">
        <div class="m-tile-inner">
          <span class="m-tile-icon">📋</span>
          <span class="m-tile-label">ePCR</span>
          <span class="m-tile-sub">ImageTrend Elite</span>
        </div>
      </a>
      <button class="m-tile" onclick="mGoTo('buildings')" style="--accent:#4a90d9">
        <div class="m-tile-inner">
          <span class="m-tile-icon">🏢</span>
          <span class="m-tile-label">Buildings</span>
          <span class="m-tile-sub">Access codes</span>
        </div>
      </button>
      <button class="m-tile" onclick="mGoTo('shuls')" style="--accent:#4a90d9">
        <div class="m-tile-inner">
          <span class="m-tile-icon">🕍</span>
          <span class="m-tile-label">Shuls</span>
          <span class="m-tile-sub">Entrance codes</span>
        </div>
      </button>
      <button class="m-tile" onclick="mGoTo('shifts')" style="--accent:#4a90d9">
        <div class="m-tile-inner">
          <span class="m-tile-icon">🌙</span>
          <span class="m-tile-label">Night Shifts</span>
          <span class="m-tile-sub">Unit assignments</span>
        </div>
      </button>
      <button class="m-tile" onclick="mGoTo('contacts')" style="--accent:#4caf80">
        <div class="m-tile-inner">
          <span class="m-tile-icon">👥</span>
          <span class="m-tile-label">Contacts</span>
          <span class="m-tile-sub">Member directory</span>
        </div>
      </button>
    </div>
  </div>
</div>

<!-- SUBPAGES: Hospital, Buildings, Shuls, Contacts, Shifts -->
<div class="page" id="m-pg-hospital">
  <div class="m-subpage-header">
    <button class="m-back-btn" onclick="mGoTo('home')">← Back</button>
    <span class="m-page-title">Hospital Codes</span>
  </div>
  <div class="m-scroll" id="m-hospital-content"></div>
</div>

<div class="page" id="m-pg-buildings">
  <div class="m-subpage-header">
    <button class="m-back-btn" onclick="mGoTo('home')">← Back</button>
    <span class="m-page-title">Buildings</span>
  </div>
  <div class="m-scroll" id="m-buildings-content">
    <div style="color:var(--gray);font-size:0.82rem">Loading...</div>

// ── CLOCK ──
function tickMClock() {
  var el = document.getElementById("m-clock");

  var now = new Date();
  var hh = String(now.getHours()).padStart(2,"0");
  var mm = String(now.getMinutes()).padStart(2,"0");
  var ss = String(now.getSeconds()).padStart(2,"0");
  var h12 = now.getHours() % 12 || 12;
  var ampm = now.getHours() < 12 ? "AM" : "PM";
  el.innerHTML = "<div style='font-size:0.78rem;font-weight:700;letter-spacing:0.06em'>" + hh+":"+mm+":"+ss + "</div>" +
                 "<div style='font-size:0.55rem;opacity:0.5'>(" + h12+":"+mm+" "+ampm + ")</div>";
}

// ── CALLS LISTENER ──
function mStartCallsListener() {
  if (mCallsListener) return;
  mCallsListener = db.collection("activeCalls")
    .where("status","==","active")
    .orderBy("createdAt","desc")
    .onSnapshot(function(snap) {
      var calls = [];
      snap.forEach(function(d) { calls.push(Object.assign({id:d.id}, d.data())); });
      mCheckNewCall(calls);
      mRenderCalls(calls);
    }, function() {
      // Fallback without orderBy
      mCallsListener = db.collection("activeCalls")
        .where("status","==","active")
        .onSnapshot(function(snap) {
          var calls = [];
          snap.forEach(function(d) { calls.push(Object.assign({id:d.id}, d.data())); });
          calls.sort(function(a,b) { return (b.createdAt||"").localeCompare(a.createdAt||""); });
          mCheckNewCall(calls);
          mRenderCalls(calls);
        });
    });
}

function mCheckNewCall(calls) {
  var isNew = false;
  calls.forEach(function(c) {
    if (!mKnownCallIds[c.id]) { mKnownCallIds[c.id] = true; if (mInitialLoadDone) isNew = true; }
  });
  if (!mInitialLoadDone) { mInitialLoadDone = true; return; }
  if (isNew) mPlayTone();
}

// ── RENDER CALLS ──
function mRenderCalls(calls) {
  var section = document.getElementById("m-calls-section");
  var list = document.getElementById("m-calls-list");
  var count = document.getElementById("m-calls-count");
  if (!section || !list) return;
  if (!calls.length) { section.style.display = "none"; return; }
  section.style.display = "block";
  count.textContent = calls.length;

  var STATUS_LABEL = {
    enroute_scene:"En Route", on_scene_direct:"On Scene",
    picking_up_ambo:"Picking Up Rig", ambo_responding:"Rig Responding", on_scene_ambo:"On Scene",
    rma_scene:"RMA", transporting:"Transporting", at_facility:"At Hospital",
    clearing_facility:"Clearing", back_at_base:"Back at Base"
  };

  list.innerHTML = calls.map(function(call) {
    var zone = call.zone === "primary" ? "primary" : call.zone === "secondary" ? "secondary" : "outside";
    var zoneLabel = call.zone === "primary" ? "Standard" : call.zone === "secondary" ? "Load a Rig" : "Outside Zone";
    var time = call.createdAt ? new Date(call.createdAt).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}) : "";
    var parts = [];
    if (call.patientAgeNum) parts.push(call.patientAgeNum + " YO");
    else if (call.patientAge === "pediatric") parts.push("Ped");
    else if (call.patientAge === "adult") parts.push("Adult");
    else if (call.patientAge === "uto") parts.push("UTO");
    if (call.patientSex === "male") parts.push("M");
    else if (call.patientSex === "female") parts.push("F");
    if (call.callNature) parts.push(call.callNature.replace(/^\d+\s*-\s*/,""));
    var naturePill = parts.length ? '<span class="m-pill nature">' + parts.join(" · ") + '</span>' : "";

    var crews = call.crews || [];
    var unitDetails = call.unitDetails || {};
    var unitPills = "";
    try {
      crews.forEach(function(crew, ci) {
        if (!crew) return;
        Object.keys(crew).sort().forEach(function(role) {
          if (role === "rig") return;
          var val = crew[role]; if (!val || val === "__added__") return;
          var det = unitDetails[ci+"_"+role] || {};
          var lbl = STATUS_LABEL[det.status] || "";
          unitPills += '<span class="m-pill unit">' + val + (lbl ? " · "+lbl : "") + '</span>';
        });
      });
    } catch(e) {}

    var alsPill = call.alsActivated ? '<span class="m-pill als">ALS: ' + (call.alsProvider||"Active") + '</span>' : "";
    var disp = (call.disposition||{}).type;
    var dispPill = disp === "transport" ? '<span class="m-pill disp-transport">Transport' + ((call.disposition||{}).hospital?" → "+call.disposition.hospital:"") + '</span>' :
                   disp === "rma" ? '<span class="m-pill disp-rma">RMA</span>' : "";

    var times = call.times || {};
    var timesHtml = "";
    if (times.dispatched||times.first_on_scene||times.enroute||times.at_hospital) {
      timesHtml = '<div class="m-times">' +
        (times.dispatched ? "<span>Disp: "+times.dispatched+"</span>" : "") +
        (times.first_on_scene ? "<span>On Scene: "+times.first_on_scene+"</span>" : "") +
        (times.enroute ? "<span>En Route: "+times.enroute+"</span>" : "") +
        (times.at_hospital ? "<span>Hospital: "+times.at_hospital+"</span>" : "") +
      '</div>';
    }

    // Check if assigned
    var isAssigned = false;
    try {
      crews.forEach(function(crew) {
        Object.keys(crew).forEach(function(k) {
          if (k !== "rig" && crew[k] === mCurrentUserUnit) isAssigned = true;
        });
      });
    } catch(e) {}

    var notes = call.callNotes || [];
    var notesHtml = "";
    if (notes.length && isAssigned) {
      notesHtml = '<div class="m-notes-section"><div class="m-notes-label">Notes</div>' +
        notes.map(function(n) {
          return '<div class="m-note-item"><span class="m-note-meta">' + (n.time||"") + (n.by?" · "+n.by:"") + " — </span>" + (n.text||"") + '</div>';
        }).join("") + '</div>';
    }

    var svThumb = (call.lat && call.lng)
      ? '<img class="m-sv" src="https://maps.googleapis.com/maps/api/streetview?size=400x200&location=' + call.lat + ',' + call.lng + '&fov=90&pitch=0&key=AIzaSyB5A1yLequWoCAVK-lPSo6qJc2BIm_5mHo" onerror="this.style.display='none'">' : "";

    var hasExtras = notes.length || call.accessCode || call.dispatchNotes;
    var actions = '<div class="m-card-actions">' +
      '<a href="' + (call.mapsLink||"#") + '" target="_blank" class="m-action-btn gold">Map</a>' +
      (isAssigned && hasExtras ? '<button onclick="mOpenDetail(\'' + call.id + \'\')" class="m-action-btn gold">Details</button>' : "") +
    '</div>';

    return '<div class="m-call-card">' +
      svThumb +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">' +
        '<span class="m-zone-pill ' + zone + '">' + zoneLabel + '</span>' +
        '<span style="font-size:0.65rem;color:var(--gray)">' + time + '</span>' +
      '</div>' +
      '<div class="m-call-addr">' + (call.address||"Unknown") + '</div>' +
      (call.crossStreet ? '<div class="m-call-cross">↪ ' + call.crossStreet + '</div>' : "") +
      '<div class="m-pills">' + alsPill + naturePill + unitPills + dispPill + '</div>' +
      timesHtml + notesHtml + actions +
    '</div>';
  }).join("");
}

      '<a href="' + (call.mapsLink||"#") + '" target="_blank" style="display:block;text-align:center;margin-top:12px;padding:12px;background:rgba(201,168,76,0.12);border:1px solid rgba(201,168,76,0.35);border-radius:8px;color:var(--gold);font-family:Oswald,sans-serif;font-size:0.8rem;font-weight:700;text-decoration:none">Open in Maps</a>';
    document.getElementById("m-detail-modal").classList.add("open");
  });
}

      '</div>';
    }).join("");
  });
}

// ── TONE ──
function mPlayTone() {
  try {
    if (!mToneCtx) mToneCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (mToneCtx.state === "suspended") mToneCtx.resume();
    var tones = [{freq:1050,s:0,e:.4},{freq:770,s:.4,e:.8},{freq:1050,s:.8,e:1.2},{freq:770,s:1.2,e:1.6},{freq:1050,s:1.6,e:2},{freq:770,s:2,e:2.4}];
    var now = mToneCtx.currentTime;
    tones.forEach(function(t) {
      var o = mToneCtx.createOscillator(), g = mToneCtx.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(t.freq, now+t.s);
      g.gain.setValueAtTime(0, now+t.s);
      g.gain.linearRampToValueAtTime(0.7, now+t.s+.02);
      g.gain.setValueAtTime(0.7, now+t.e-.02);
      g.gain.linearRampToValueAtTime(0, now+t.e);
      o.connect(g); g.connect(mToneCtx.destination);
      o.start(now+t.s); o.stop(now+t.e);
    });
  } catch(e) {}
}

// ── PUSH / SW ──
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/CallDashboard/sw.js").then(function(reg) {
    mSWReg = reg;
    navigator.serviceWorker.addEventListener("message", function(e) {
      if (!e.data) return;
      if (e.data.type === "PLAY_TONE") mPlayTone();
      if (e.data.type === "NEW_CALL" && e.data.callId) {
        mGoTo("home");
      }
    });
  }).catch(function() {});
}

function mSendTokenToSW() {
  if (!mCurrentUser || !mSWReg) return;
  mCurrentUser.getIdToken(false).then(function(token) {
    if (mSWReg.active) mSWReg.active.postMessage({type:"AUTH_TOKEN", token:token});
  }).catch(function() {});
}

function mRequestPush() {
  if (!("Notification" in window)) { mToast("Notifications not supported", true); return; }
  if (!FCM_VAPID_KEY) { mToast("Push not configured", true); return; }
  Notification.requestPermission().then(function(p) {
    if (p !== "granted") { mToast("Notifications blocked in settings", true); return; }
    var msg = firebase.messaging();
    msg.getToken({vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: mSWReg})
      .then(function(token) {
        if (!token) { mToast("Could not get push token", true); return; }
        return db.collection("pushTokens").doc(mCurrentUser.uid).set({
          token: token, unit: mCurrentUserUnit, uid: mCurrentUser.uid,
          platform: /iPhone|iPad|iPod/.test(navigator.userAgent) ? "ios" : "android",
          updatedAt: new Date().toISOString()
        });
      })
      .then(function() { mToast("Alerts enabled!"); mUpdateAlertBtn(); })
      .catch(function(e) { mToast("Error: " + e.message, true); });
  });
}

function mUpdateAlertBtn() {
  var btn = document.getElementById("m-alert-btn");
  if (!btn) return;
  if (Notification.permission === "granted") {
    btn.textContent = "Alerts On"; btn.style.color = "#7dedb5";
  } else {
    btn.textContent = "Alerts"; btn.style.color = "var(--gray)";
  }
}
</script>
